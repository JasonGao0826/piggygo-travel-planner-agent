  intro: 从 Coronet Peak 约 4100 英尺处起飞，和教练双人滑翔伞俯瞰皇后镇盆地。
  notes:
  - 夏季每 1.5 小时一班，09:00–19:30。
  - 从报到到回到市区约 2 小时，空中飞 10–20 分钟。
  - 在 45 Camp Street 的 ZipTrek 店内集合，有免费接驳车，集合点没有停车位。
  - 自驾可在 Coronet Peak Road 4 号停车场汇合，但降落在别处，需要另有人把车开下山。
  - 出发前 1 小时查官网 Flight Status（一般每天 8 点前更新）。
  - 受天气影响很大，建议预留一个备用日。
  - 迟到不退款；穿护脚踝的鞋，多带一层保暖衣服。
  - 照片和视频包落地后向教练另购。
  data_notes:
  - 班次按官网“每 1.5 小时（9am–7.30pm）”推算为 09:00/10:30/12:00/13:30/15:00/16:30/18:00/19:30，以预订系统为准；close 21:30 为末班 19:30 + 2 小时推算。
  - 季节规则按官网“10 月至 5 月初”保守写到 04-30。
  - 2026-10-22 查询当天官网显示中午后全部取消。
  - 价格 NZ$369 与旧计划一致。
  - 官网未写报到需提前多少分钟。
  - 体重上限降到 110kg 的月份：首页写 3–5 月，FAQ 写 4–5 月，不影响 11 月。
  - 降落点 Flight Park 地址：793 Malaghans Road。
  sources:
