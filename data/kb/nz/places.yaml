  intro: 乘缆车上鲍勃峰俯瞰皇后镇和瓦卡蒂普湖，山顶可玩斜坡滑车（Luge）。
  notes:
  - 缆车 09:30–21:00 可登车，滑车 10:00–21:00 发车。
  - 滑车场次前至少 45 分钟到缆车下站，验票后坐缆车上山。
  - 天气暂停时，滑车票会自动顺延到下一个场次。
  - 山顶在改建，部分区域要走脚手架通道。
  - 下站后方有收费多层停车楼，出示缆车票有折扣。
  - 露营车不能停在市中心，大车停 Boundary Street 停车场。
  data_notes:
  - 21:00 是最晚登车时间，官网说明已预留山顶 1 小时，close 22:00 为推算；滑车 21:00 为最后一趟出发。
  - 官网只公布未来几周的营业时间（2026-10-22 查询为常规时间），出发前再核对。
  - 价格（官网 2026-10-22）：缆车 NZ$69，缆车+3 次滑车 NZ$99，缆车+6 次滑车 NZ$106，与旧计划一致。
  - 停车楼 297 个车位；CBD 露营车违停罚款 NZ$40–60（Skyline 官网 getting-here 页）。
  - 游玩时长官网未给出。
  - 地址门牌 53 Brecon Street 来自 OSM，官网只写 Brecon Street。
