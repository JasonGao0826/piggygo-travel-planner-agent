[project]
name = "tripagent"
version = "0.1.0"
description = "旅行规划助手 Agent 后端核心"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "tzdata",
    "openai>=3.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "mcp>=2.3",
    "holidays>=0.107",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tripagent*"]

[tool.setuptools.package-data]
tripagent = ["report/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
